name: Checks

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm verify

      # Expo ships SDK patches often, so drift warns instead of failing the PR.
      - name: Expo package versions
        run: >
          pnpm deps:check ||
          echo "::warning title=Expo packages are behind::Run pnpm deps:fix and commit package.json + pnpm-lock.yaml"

      - name: Export bundles
        run: pnpm export:all
